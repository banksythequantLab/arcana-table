name = "arcana-dm"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Swap the DM's brain here without touching code.
MODEL = "gpt-5.6-luna"
ALLOWED_ORIGINS = "https://arcana-table.pages.dev,http://localhost:8080,http://127.0.0.1:8080"

# Per-IP spend guard. A turn costs up to ~6 calls (tool hops), and a human plays
# a turn every 10-20s, so 40/minute is roomy for real play and tight on abuse.
[[ratelimits]]
name = "RATE"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

# The API key is a secret, never a var:
#   wrangler secret put OPENAI_API_KEY
